name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild External.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: External-exe
          path: External/x64/Release/External.exe
