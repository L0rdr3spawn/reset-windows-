# Alembic-Konfiguration des Schulmanagers.
# Die Datenbank-URL kommt aus SM_DATABASE_URL (siehe schulmanager/server/migrations/env.py).
# Aufruf im Repo-Root:  alembic upgrade head   bzw.   python -m schulmanager.server.migrate
[alembic]
script_location = %(here)s/schulmanager/server/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url wird absichtlich nicht gesetzt (SM_DATABASE_URL)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
