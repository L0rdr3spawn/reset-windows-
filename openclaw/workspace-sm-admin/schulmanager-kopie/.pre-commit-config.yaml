# Schulmanager – Git-Hooks
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]          # Compose-Tags wie !reset/!override erlauben
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: no-env-files
        name: Keine .env-Dateien mit Zugangsdaten committen
        entry: .env-Dateien dürfen nicht eingecheckt werden (nur .env.example)
        language: fail
        files: (^|/)\.env(\..+)?$
        exclude: (^|/)\.env\.example$
      - id: frontend-typecheck
        name: Frontend-Typecheck (tsc)
        entry: bash -c 'cd frontend && [ -d node_modules ] && npm run --silent typecheck || echo "node_modules fehlt – übersprungen"'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
