# Schulmanager – Entwicklungsumgebung in Containern
#
#   docker compose -f docker-compose.dev.yml up --build
#     → Backend  http://localhost:8000  (uvicorn --reload, SQLite in ./data/dev.db)
#     → Frontend http://localhost:5173  (Vite-Dev-Server mit Hot-Reload, Proxy /api → api:8000)
#     → Login:   admin / ${SM_ADMIN_PASSWORD:-schulmanager-dev}  (Demo-Schule wird beim ersten Start geladen)
#
#   Optional:
#     --profile postgres   PostgreSQL 16 auf 127.0.0.1:5432 (dann DEV_DATABASE_URL setzen, siehe unten)
#     --profile mail       Mailpit: fängt alle E-Mails ab, Weboberfläche http://localhost:8025
#
# Ohne Docker geht es mit: make dev  (scripts/dev.sh)

name: schulmanager-dev

services:
  api:
    build:
      context: .
      target: dev
    image: schulmanager:dev
    # Eigene UID/GID, damit im Quellbaum keine root-Dateien entstehen (make dev-docker setzt sie)
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    working_dir: /app
    command:
      - uvicorn
      - schulmanager.server.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/schulmanager
    environment:
      SM_ENV: development
      # SQLite (Default) oder Postgres-Profil: postgresql+psycopg://schulmanager:schulmanager@db-dev:5432/schulmanager
      SM_DATABASE_URL: ${DEV_DATABASE_URL:-sqlite:///./data/dev.db}
      SM_DATA_DIR: ./data
      SM_BASE_URL: http://localhost:5173
      SM_COOKIE_SECURE: "0"
      SM_ADMIN_USER: ${SM_ADMIN_USER:-admin}
      SM_ADMIN_PASSWORD: ${SM_ADMIN_PASSWORD:-schulmanager-dev}
      SM_LOAD_DEMO: ${SM_LOAD_DEMO:-1}
      SM_LOG_LEVEL: ${SM_LOG_LEVEL:-DEBUG}
      SM_LOG_FORMAT: text
      SM_GENERATE_TIME_LIMIT: ${SM_GENERATE_TIME_LIMIT:-20}
      SM_FRONTEND_DIST: frontend/dist
      SM_SMTP_HOST: ${DEV_SMTP_HOST:-}
      SM_SMTP_PORT: ${DEV_SMTP_PORT:-1025}
      SM_SMTP_FROM: ${DEV_SMTP_FROM:-schulmanager@localhost}
      SM_SMTP_TLS: none
      PYTHONDONTWRITEBYTECODE: "1"
      HOME: /tmp
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8000}:8000"

  web:
    image: node:22-alpine
    working_dir: /app/frontend
    environment:
      SM_BACKEND: http://api:8000
      CI: "true"
    # node_modules liegen in einem eigenen Volume (Linux/musl-Binaries ≠ Host-Binaries).
    # npm ci läuft nur, wenn sich package-lock.json geändert hat.
    command:
      - sh
      - -c
      - |
        set -e
        hash=$$(sha1sum package-lock.json 2>/dev/null | cut -d' ' -f1 || echo none)
        if [ ! -f node_modules/.lock-hash ] || [ "$$(cat node_modules/.lock-hash)" != "$$hash" ]; then
          echo "Installiere Frontend-Abhängigkeiten …"
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          echo "$$hash" > node_modules/.lock-hash
        fi
        exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ./frontend:/app/frontend
      - web_node_modules:/app/frontend/node_modules
    ports:
      - "127.0.0.1:${DEV_WEB_PORT:-5173}:5173"
    depends_on:
      - api

  db-dev:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: schulmanager
      POSTGRES_USER: schulmanager
      POSTGRES_PASSWORD: schulmanager
    ports:
      - "127.0.0.1:${DEV_PG_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schulmanager -d schulmanager -q"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${DEV_MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:1025:1025"

volumes:
  web_node_modules:
  pgdata_dev:
