# Schulmanager – Continuous Integration
#
# Backend (Python 3.11 + 3.12: ruff, pytest), PostgreSQL-Migrationen + Start-Smoke-Test,
# Frontend (Node 22: typecheck, test, build), Infrastruktur-Lint (shellcheck, Compose, Caddy,
# Prometheus) und Docker-Build (ohne Push, mit Cache) inkl. Container-Smoke-Test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Abhängigkeiten installieren (gesperrte Versionen mit Hashes)
        run: |
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Pytest
        env:
          SM_NOTIFY_DISPATCHER: "0"
        run: python -m pytest -q

  # Bekannte Schwachstellen in gesperrten Abhängigkeiten (S-14): Python (pip-audit) und Frontend (npm audit)
  audit:
    name: Abhängigkeits-Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: pip-audit (requirements-dev.lock)
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip
      - name: npm audit (nur Laufzeit-Abhängigkeiten)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  backend-postgres:
    name: PostgreSQL-Migration & Start
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schulmanager
          POSTGRES_USER: schulmanager
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U schulmanager -d schulmanager"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SM_ENV: production
      SM_DATABASE_URL: postgresql+psycopg://schulmanager:ci-password@127.0.0.1:5432/schulmanager
      SM_SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
      # Fester CI-Schlüssel (nur Testdaten) – Produktion verlangt SM_ENCRYPTION_KEYS
      SM_ENCRYPTION_KEYS: ci:Y2ktbnVyLXRlc3RkYXRlbi1zY2hsdWVzc2VsLTMyQiE=
      SM_BASE_URL: https://ci.example.org
      SM_ADMIN_USER: admin
      SM_ADMIN_PASSWORD: Ci-Sonnenblume-2026
      SM_NOTIFY_DISPATCHER: "0"
      SM_DATA_DIR: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - run: |
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip install --no-deps -e .

      - name: PostgreSQL-Test der Testsuite (SM_TEST_POSTGRES_URL)
        env:
          SM_ENV: development
          SM_TEST_POSTGRES_URL: postgresql://schulmanager:ci-password@127.0.0.1:5432/schulmanager
        run: python -m pytest -q tests/test_server_core_store.py -k postgres -rs

      - name: Migrationen (zweimal → idempotent)
        run: |
          scripts/migrate.sh
          scripts/migrate.sh

      - name: Server starten und /healthz prüfen
        run: |
          uvicorn schulmanager.server.app:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          scripts/healthcheck.sh --wait 90
          curl -fsS http://127.0.0.1:8000/metrics | grep -q '^schulmanager_info'
          python -m schulmanager.server.cli list-users

      - name: Backup & Test-Restore (pg_dump/pg_restore aus postgresql-client)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          if pg_dump --version | grep -q ' 16\.'; then
            BACKUP_DIR=$RUNNER_TEMP/backups scripts/backup.sh
            dump="$(find "$RUNNER_TEMP/backups/daily" -name '*.dump' | head -n1)"
            BACKUP_DIR=$RUNNER_TEMP/backups RESTORE_TEST_DB=sm_restore_test scripts/restore.sh --test "$dump"
          else
            echo "pg_dump $(pg_dump --version) passt nicht zu Server 16 – übersprungen (läuft im backup-Container)."
          fi

      - name: Server-Log
        if: always()
        run: cat uvicorn.log || true

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Tests
        run: npm test --if-present

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  infra-lint:
    name: Infrastruktur-Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck & bash -n
        run: |
          shellcheck scripts/*.sh deploy/docker/entrypoint.sh deploy/backup/backup-loop.sh
          for f in scripts/*.sh deploy/docker/entrypoint.sh deploy/backup/backup-loop.sh; do bash -n "$f"; done

      - name: YAML-Dateien parsen
        run: |
          python3 - <<'PY'
          import glob, yaml

          class Loader(yaml.SafeLoader):
              """SafeLoader, der Compose-Tags wie !reset/!override toleriert."""

          Loader.add_multi_constructor("!", lambda loader, suffix, node: None)
          files = [f for p in ("*.yml", ".github/**/*.yml", "deploy/**/*.yml") for f in glob.glob(p, recursive=True)]
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  list(yaml.load_all(fh, Loader=Loader))
              print("OK", f)
          PY

      - name: Docker-Compose-Dateien prüfen
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile monitoring --profile uptime config -q
          docker compose -f docker-compose.sqlite.yml config -q
          docker compose -f docker-compose.dev.yml --profile postgres --profile mail config -q
          rm .env

      - name: Caddyfile validieren
        run: |
          docker run --rm -e SM_DOMAIN=plan.example.org -e ACME_EMAIL=it@example.org \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/deploy/caddy/conf.d:/etc/caddy/conf.d:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Prometheus-Konfiguration prüfen
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3 check config /etc/prometheus/prometheus.yml

      - name: Grafana-Dashboard (JSON) prüfen
        run: python3 -m json.tool deploy/grafana/dashboards/schulmanager.json > /dev/null

  docker:
    name: Docker-Build & Smoke-Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: App-Image bauen (ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: schulmanager:ci
          build-args: |
            APP_VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Backup-Image bauen (ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backup/Dockerfile
          load: true
          push: false
          tags: schulmanager-backup:ci
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

      - name: Container mit SQLite starten (read-only, ohne Capabilities)
        run: |
          docker run -d --name sm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 \
            -e SM_SECRET_KEY="$(openssl rand -hex 32)" -e SM_ADMIN_PASSWORD=Ci-Sonnenblume-2026 \
            -e SM_ENCRYPTION_KEYS="k1:$(openssl rand -base64 32)" \
            -e SM_BASE_URL=https://ci.example.org schulmanager:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' sm)"
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' sm)" = true ] || break
            sleep 3
          done
          docker logs sm
          test "$(docker inspect -f '{{.State.Health.Status}}' sm)" = healthy
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker exec sm schulmanager-entrypoint cli list-users

      - name: Image-Größe
        run: docker image ls schulmanager

      - name: Aufräumen
        if: always()
        run: docker rm -f sm || true
