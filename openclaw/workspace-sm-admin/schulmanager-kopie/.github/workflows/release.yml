# Schulmanager – Release: bei Tags v* Images nach GHCR pushen und GitHub-Release anlegen
#
#   git tag -a v1.2.0 -m "Schulmanager 1.2.0" && git push origin v1.2.0
#
# Ergebnis:
#   ghcr.io/<owner>/<repo>:1.2.0, :1.2, :1, :latest          (App, linux/amd64 + linux/arm64)
#   ghcr.io/<owner>/<repo>-backup:1.2.0, … :latest           (Backup-Sidecar)
# In .env der Schule: SM_IMAGE=ghcr.io/<owner>/<repo>:1.2.0 und SM_BACKUP_IMAGE=…-backup:1.2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandenes Tag (z. B. v1.2.0) erneut veröffentlichen"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Images bauen & pushen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            suffix: ""
          - name: backup
            dockerfile: deploy/backup/Dockerfile
            suffix: "-backup"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Image-Namen (GHCR verlangt Kleinschreibung)
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Schulmanager${{ matrix.suffix }}
            org.opencontainers.image.description=Schulverwaltung mit Stundenplan-Generator und Live-Vertretungsplanung

      - name: Bauen & pushen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.names.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.names.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

      - name: Build-Provenienz bestätigen
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: GitHub-Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Release anlegen (Notizen aus Commits/PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          ## Container-Images

          \`\`\`
          docker pull ghcr.io/${repo}:${TAG#v}
          docker pull ghcr.io/${repo}-backup:${TAG#v}
          \`\`\`

          In der \`.env\`: \`SM_IMAGE=ghcr.io/${repo}:${TAG#v}\` und \`SM_BACKUP_IMAGE=ghcr.io/${repo}-backup:${TAG#v}\`,
          danach \`docker compose pull && docker compose up -d\`. Update-Ablauf: docs/BETRIEB.md.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits – nur Images aktualisiert."
          else
            gh release create "$TAG" --title "Schulmanager ${TAG#v}" --generate-notes --notes-file notes.md --verify-tag
          fi
