# Schulmanager – nginx als Reverse Proxy (Alternative zu Caddy, z. B. für die Installation ohne Docker)
#
# Installation (Debian/Ubuntu):
#   apt install nginx certbot python3-certbot-nginx
#   cp deploy/nginx/schulmanager.conf /etc/nginx/sites-available/schulmanager.conf
#   sed -i 's/plan.example.org/plan.meine-schule.de/g' /etc/nginx/sites-available/schulmanager.conf
#   ln -s /etc/nginx/sites-available/schulmanager.conf /etc/nginx/sites-enabled/
#   certbot certonly --nginx -d plan.meine-schule.de      # Zertifikat (erneuert sich per Timer)
#   nginx -t && systemctl reload nginx
#
# Die App läuft dahinter auf 127.0.0.1:8000 (deploy/systemd/schulmanager.service) mit
# SM_TRUST_PROXY=1, SM_PROXY_COUNT=1 und SM_TRUSTED_PROXIES=127.0.0.1 (nur dieser Proxy darf X-Forwarded-* setzen).

# --- Rate-Limits (gelten im http-Kontext; diese Datei wird dort eingebunden) -----------------
# Login: 10 Versuche/Minute pro IP (zusätzlich zur Kontosperre in der App)
limit_req_zone $binary_remote_addr zone=sm_login:10m rate=10r/m;
# Allgemeine API: großzügig, bremst nur Skripte/Scraper
limit_req_zone $binary_remote_addr zone=sm_api:20m rate=20r/s;
limit_req_status 429;

upstream schulmanager_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Access-Log ohne persönliche iCal-Tokens (/ical/<token>.ics) – Datensparsamkeit
map $request_uri $sm_uri_safe {
    "~^/ical/[^/?]+(?<sm_rest>.*)$"   "/ical/***$sm_rest";
    default                           $request_uri;
}
# IP-Adressen im Log kürzen (IPv4 /24, IPv6 /48) – wie Caddy und das App-Zugriffsprotokoll (S-11)
map $remote_addr $sm_ip_short {
    "~^(?<a>\d+\.\d+\.\d+)\.\d+$"                          "$a.0";
    "~^(?<b>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):.*$"       "$b::";
    default                                                  "anonym";
}
log_format sm_privacy '$sm_ip_short - [$time_local] "$request_method $sm_uri_safe $server_protocol" '
                      '$status $body_bytes_sent $request_time "$http_user_agent"';

# HTTP → HTTPS (ACME-Challenge bleibt erreichbar)
server {
    listen 80;
    listen [::]:80;
    server_name plan.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plan.example.org;

    # --- TLS (Zertifikate von certbot) -------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/plan.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SM_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security-Header ---------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Achtung: Die App setzt die CSP selbst und erweitert sie für eingeschaltete Anmeldedienste (Google/Apple, docs/ANMELDEDIENSTE.md).
    # Diese feste Zeile würde zusätzlich gelten und deren Skripte blockieren → bei Google/Apple-Anmeldung entfernen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    server_tokens off;

    # --- Allgemein ---------------------------------------------------------------------------
    client_max_body_size 50m;           # Untis-/CSV-/JSON-Importe
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/csv text/calendar application/json application/javascript
               application/xml image/svg+xml;

    access_log /var/log/nginx/schulmanager.access.log sm_privacy;
    error_log  /var/log/nginx/schulmanager.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Eingehendes X-Forwarded-For NICHT übernehmen (sonst fälschbar) – nur die echte Client-IP
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;            # Generator-Endpunkte antworten asynchron (Job-ID)
    proxy_send_timeout 120s;

    # --- Server-Sent Events (Live-Vertretungsplan, Job-Fortschritt) ----------------------------
    location = /api/v1/events {
        proxy_pass http://schulmanager_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;           # Verbindung bleibt offen; die App sendet regelmäßig "ping"
        proxy_send_timeout 1h;
    }

    # --- Login mit Rate-Limit ------------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=sm_login burst=5 nodelay;
        proxy_pass http://schulmanager_app;
    }

    # --- API -------------------------------------------------------------------------------------
    location /api/ {
        limit_req zone=sm_api burst=100 nodelay;
        proxy_pass http://schulmanager_app;
    }

    # --- Metriken nur lokal (Prometheus auf demselben Host) --------------------------------------
    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://schulmanager_app;
    }

    # --- Statische Assets direkt von der Platte (Vite-Hashes → lange cachebar) -----------------
    # Pfad an die Installation anpassen (SM_FRONTEND_DIST)
    location /assets/ {
        alias /opt/schulmanager/frontend/dist/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Alles andere (SPA, /ical, /healthz, /docs) an die App -----------------------------------
    location / {
        proxy_pass http://schulmanager_app;
    }

    # Freundliche Wartungsseite bei Neustart/Update
    error_page 502 503 504 /wartung.html;
    location = /wartung.html {
        internal;
        default_type text/html;
        add_header Retry-After 30 always;
        return 503 '<!doctype html><html lang="de"><meta charset="utf-8"><meta http-equiv="refresh" content="30"><title>Schulmanager – Wartung</title><body style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem"><h1>Schulmanager startet gerade neu</h1><p>Der Dienst ist in Kürze wieder erreichbar. Diese Seite lädt sich automatisch neu.</p></body></html>';
    }
}
