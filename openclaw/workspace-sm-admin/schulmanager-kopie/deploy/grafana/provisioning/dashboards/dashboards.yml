# Schulmanager – Dashboards aus deploy/grafana/dashboards/ laden (Änderungen in der UI werden
# beim Neustart durch die Datei ersetzt; eigene Dashboards bitte in einem anderen Ordner anlegen)
apiVersion: 1

providers:
  - name: schulmanager
    orgId: 1
    folder: Schulmanager
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
