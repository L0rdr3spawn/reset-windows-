# Schulmanager – Grafana-Alarmierung (automatisch provisioniert)
#
# E-Mail an ALERT_EMAIL (docker-compose.yml → .env). Voraussetzung: GRAFANA_SMTP_ENABLED=true und
# GRAFANA_SMTP_HOST (host:port) gesetzt; Zugangsdaten werden von SM_SMTP_* übernommen.
# Weitere Kanäle (Matrix, Teams, Telegram …) lassen sich in der Grafana-Oberfläche ergänzen.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: schulmanager-admins
    receivers:
      - uid: sm-admins-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: schulmanager-admins
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: schulmanager
    folder: Schulmanager
    interval: 1m
    rules:
      - uid: sm-app-down
        title: Schulmanager nicht erreichbar
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: Prometheus erreicht den Schulmanager seit mehr als 2 Minuten nicht.
          description: "Siehe docs/BETRIEB.md, Abschnitt Troubleshooting."
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(up{job="schulmanager"})
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}

      - uid: sm-error-rate
        title: Schulmanager Fehlerquote > 5 %
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: Mehr als 5 % der Anfragen enden mit HTTP 5xx.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(rate(schulmanager_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(schulmanager_http_requests_total[5m])), 0.001)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}

      - uid: sm-latency
        title: Schulmanager langsam (p95 > 2 s)
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: warning
        annotations:
          summary: 95 % der Anfragen dauern länger als 2 Sekunden.
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: histogram_quantile(0.95, sum by (le) (rate(schulmanager_http_request_duration_seconds_bucket[5m])))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [2]}
